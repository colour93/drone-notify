[package]
name = "drone_notify"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1"
dialoguer = "0.11"
notify-rust = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
url = "2"